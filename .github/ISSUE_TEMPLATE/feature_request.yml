name: Feature request
description: Suggest an improvement or new capability
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing an idea.

  - type: textarea
    id: idea
    attributes:
      label: What would you like to change?
      description: A clear description of the improvement or new capability.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
      description: The use case or pain point it addresses.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Screenshots, references, related discussions.
    validations:
      required: false
