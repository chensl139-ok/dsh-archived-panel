name: Bug report
description: Report a problem with the archived panel plugin
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in the details below.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version / build
      description: The `dsh --version` output, or the commit you're running.
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps + any error output / console messages.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: unarchive-patched
    attributes:
      label: Is the unarchiveSession patch applied?
      options:
        - "No (view + open only)"
        - "Yes"
        - "Not sure"
    validations:
      required: false
